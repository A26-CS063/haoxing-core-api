name: Continuous Integration

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  quality-check:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummydb
      DIRECT_URL: postgresql://dummy:dummy@localhost:5432/dummydb
      JWT_SECRET: ci_test_jwt_secret_key_minimum_32_characters_long_12345
      JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_minimum_32_characters_12345
      JWT_EXPIRES_IN: 1d
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier Check
        run: npm run format:check

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Automated Tests with Coverage
        run: npm run test:coverage
